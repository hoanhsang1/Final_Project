spring.application.name=IdentityService-test
spring.datasource.url=jdbc:h2:mem:identity_tests;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=POSITION,ROLE,CLASS,SESSION
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:identity-test-schema.sql
jwt.secret-base64=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
INTERNAL_API_KEY=test-internal-key-at-least-thirty-two-characters
OWNER_BOOTSTRAP_ENABLED=false
# Disable Eureka completely
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.prefer-ip-address=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
# Disable health checks that try to call out
management.health.eureka.enabled=false
# Connect timeout fast-fail for PeopleClient in tests
PEOPLE_SERVICE_URL=http://127.0.0.1:19999
logging.level.org.hibernate.SQL=WARN
logging.level.com.mems=ERROR
people.compensation-delay-ms=3600000
debug=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
