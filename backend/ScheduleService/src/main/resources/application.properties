spring.application.name=ScheduleService
server.port=${PORT:8083}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Cấu hình Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Đăng ký với Eureka Server
eureka.client.register-with-eureka=true


# Lấy danh sách các service từ Eureka Server
eureka.client.fetch-registry=true

jwt.secret-base64=${JWT_SECRET_BASE64}

# Phần 7 — hai hạng mục CHƯA CHỐT, mặc định tắt (TODO: triển khai khi có đặc tả).
schedule.approval.enabled=${SCHEDULE_APPROVAL_ENABLED:false}
schedule.outside-room-booking.enabled=${SCHEDULE_OUTSIDE_BOOKING_ENABLED:false}
