spring.application.name=ScheduleService
server.port=8083

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mems_schedule_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Cấu hình Eureka Client
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Đăng ký với Eureka Server
eureka.client.register-with-eureka=true


# Lấy danh sách các service từ Eureka Server
eureka.client.fetch-registry=true

jwt.secret-base64=${JWT_SECRET_BASE64}
