server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mems_identity}
    username: ${DB_USER:mems_user}
    password: ${DB_PASSWORD:mems_pass}

  jpa:
    hibernate:
      # validate: Hibernate chỉ KIỂM TRA entity khớp schema, KHÔNG tự tạo/sửa bảng.
      # Flyway (db/migration) mới là nơi duy nhất thay đổi schema — tránh lệch dữ liệu khi deploy thật.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # KHÔNG commit secret thật — override bằng biến môi trường JWT_SECRET khi chạy thật
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-env-minimum-32-chars}
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 7

logging:
  level:
    com.mems.identity: DEBUG
    org.hibernate.SQL: ${SHOW_SQL:false}
