spring.application.name=FacilityService-test
spring.datasource.url=jdbc:h2:mem:facility_tests;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=POSITION,ROLE,CLASS,SESSION
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:facility-test-schema.sql
jwt.secret-base64=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
INTERNAL_API_KEY=test-internal-key-at-least-thirty-two-characters
OWNER_BOOTSTRAP_ENABLED=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
logging.level.org.hibernate.SQL=WARN
logging.level.com.mems=ERROR
people.compensation-delay-ms=3600000
debug=false
logging.level.root=WARN
logging.level.org.springframework=WARN
