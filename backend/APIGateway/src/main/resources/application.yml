spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "https://*.vercel.app"
              - "https://final-project-psi-lemon.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: identity-modules
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/modules/**,/api/v1/modules

        - id: identity-organizations
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/organizations/**

        - id: identity-accounts
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/accounts

        - id: identity-audit-logs
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/audit-logs/**,/api/v1/audit-logs

        - id: people-departments
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/departments/**,/departments,/departments/

        - id: people-positions
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/positions/**,/positions,/positions/

        - id: people-permissions
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/permissions/**,/permissions,/permissions/

        - id: people-students
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/students/**,/students,/students/

        - id: people-classes
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/classes/**,/classes,/classes/
