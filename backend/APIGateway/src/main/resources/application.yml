spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "https://*.vercel.app"
              - "https://final-project-psi-lemon.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: identity-modules
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/modules/**,/api/v1/modules

        - id: identity-organizations
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/organizations/**

        - id: identity-accounts
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/accounts

        - id: identity-audit-logs
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/audit-logs/**,/api/v1/audit-logs

        - id: people-departments
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/departments/**,/departments,/departments/

        - id: people-positions
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/positions/**,/positions,/positions/

        - id: people-permissions
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/permissions/**,/permissions,/permissions/

        - id: people-permission-bundles
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/permission-bundles/**,/permission-bundles,/permission-bundles/

        - id: people-students
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/students/**,/students,/students/

        - id: people-classes
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/classes/**,/classes,/classes/

        - id: people-teachers
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/teachers/**,/teachers,/teachers/

        - id: people-specialties
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/specialties/**,/specialties,/specialties/

        - id: people-transfer-requests
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/transfer-requests/**,/transfer-requests,/transfer-requests/

        - id: people-notifications
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/notifications/**,/notifications,/notifications/

        - id: people-users
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/users/**,/users,/users/

        # Sprint 4 FE gọi kèm prefix /api; gateway bỏ 1 segment để khớp controller.
        - id: people-teachers-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/teachers/**,/api/teachers
          filters:
            - StripPrefix=1

        - id: people-specialties-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/specialties/**,/api/specialties
          filters:
            - StripPrefix=1

        - id: people-subjects-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/subjects/**,/api/subjects
          filters:
            - StripPrefix=1

        - id: people-classes-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/classes/**,/api/classes
          filters:
            - StripPrefix=1

        - id: people-transfer-requests-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/transfer-requests/**,/api/transfer-requests
          filters:
            - StripPrefix=1

        - id: people-notifications-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**,/api/notifications
          filters:
            - StripPrefix=1

        - id: people-delegations-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/delegations/**,/api/delegations
          filters:
            - StripPrefix=1

        - id: people-general-manager-api
          uri: ${PEOPLE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/general-manager/**,/api/general-manager
          filters:
            - StripPrefix=1

        # Phần 7 — lịch học & cơ sở vật chất (FE gọi /api/departments/{id}/...).
        - id: schedule-department-api
          uri: ${SCHEDULE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/departments/*/schedules/**,/api/departments/*/schedules
          filters:
            - StripPrefix=1

        - id: schedule-self-api
          uri: ${SCHEDULE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/schedules/**
          filters:
            - StripPrefix=1

        - id: facility-department-api
          uri: ${FACILITY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/departments/*/facilities/**,/api/departments/*/facilities
          filters:
            - StripPrefix=1
