services:
  mysql:
    image: mysql:8.4
    container_name: mems-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mems_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  identity-org-service:
    build:
      context: ./backend/IdentityService
    container_name: mems-identity-org
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mems_identity_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  people-service:
    build:
      context: ./backend/PeopleService
    container_name: mems-people
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mems_people_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  schedule-service:
    build:
      context: ./backend/ScheduleService
    container_name: mems-schedule
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mems_schedule_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy

  facility-service:
    build:
      context: ./backend/FacilityService
    container_name: mems-facility
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mems_facility_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mems_mysql_data: