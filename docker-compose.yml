services:
  identity-org-service:
    build:
      context: ./backend/IdentityService
    container_name: mems-identity-org
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/mems_identity_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"

  people-service:
    build:
      context: ./backend/PeopleService
    container_name: mems-people
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/mems_people_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"

  schedule-service:
    build:
      context: ./backend/ScheduleService
    container_name: mems-schedule
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/mems_schedule_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:8083"

  facility-service:
    build:
      context: ./backend/FacilityService
    container_name: mems-facility
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/mems_facility_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8084"