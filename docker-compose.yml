version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mems_user
      POSTGRES_PASSWORD: mems_pass
      # Tạo sẵn database cho identity-service; service sau (people, schedule, facility)
      # thêm database riêng trong init script này khi tới lượt code, KHÔNG dùng chung 1 DB.
      POSTGRES_DB: mems_identity
    ports:
      - "5432:5432"
    volumes:
      - mems_pg_data:/var/lib/postgresql/data

volumes:
  mems_pg_data:
