name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [APIGateway, EurekaServer, IdentityService, PeopleService, ScheduleService, FacilityService]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Maven mirror
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
              <mirrors>
                  <mirror>
                      <id>google-maven-central</id>
                      <mirrorOf>central</mirrorOf>
                      <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                  </mirror>
              </mirrors>
          </settings>
          EOF
      - name: Build
        working-directory: backend/${{ matrix.module }}
        run: chmod +x mvnw && ./mvnw -B -DskipTests -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
