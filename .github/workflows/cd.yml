name: CD

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [APIGateway, EurekaServer, IdentityService, PeopleService, ScheduleService, FacilityService]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase module name
        run: echo "IMAGE=$(echo '${{ matrix.module }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ matrix.module }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mems-${{ env.IMAGE }}:latest